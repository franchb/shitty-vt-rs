[package]
name = "shitty-vt-sys"
description = "Raw FFI bindings to shitty's C VT-core facade (libshitty_vt)"
links = "shitty_vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

keywords = ["terminal", "vt", "ffi", "bindings", "shitty"]
categories = ["external-ffi-bindings", "command-line-interface"]
readme = "../README.md"

[package.metadata.docs.rs]
# No libshitty_vt on docs.rs; build.rs skips linking when DOCS_RS is set.
all-features = true

[build-dependencies]
pkg-config = "0.3"
