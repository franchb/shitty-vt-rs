name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Upstream is the moving part. The facade's contract can change under
    # this crate between releases - it already has once - so check daily
    # rather than finding out when someone builds against a new shitty.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    name: build the facade, test both link modes
    runs-on: ubuntu-24.04
    # The core is C++26. Fedora's stock toolchain can build it, and keeping
    # the terminal and the tests on one libc matters: a nix-built library
    # against a system-built test binary fails to load.
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install the toolchain
        # The build probes every dependency up front, GUI ones included, so
        # the list matches what shitty's own Fedora job installs even though
        # only the embed targets are built here. Retried because the Fedora
        # mirrors fail mid-download often enough to matter.
        run: |
          for attempt in 1 2 3; do
            if dnf -y --setopt=install_weak_deps=False \
                --setopt=retries=10 --setopt=timeout=60 \
                --setopt=fastestmirror=True --setopt=zchunk=False \
                install \
                gcc-c++ make git python3 perl pkgconf-pkg-config diffutils \
                binutils ragel glslang librsvg2-tools \
                cargo rustfmt clippy \
                freetype-devel fontconfig-devel harfbuzz-devel \
                libxkbcommon-devel \
                vulkan-headers vulkan-loader-devel \
                wayland-devel wayland-protocols-devel; then
              exit 0
            fi
            echo "dnf attempt $attempt failed, retrying"
          done
          exit 1

      - name: Check out the bindings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out shitty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/shitty
          ref: master
          path: shitty

      - name: Record which shitty this is
        run: git config --global --add safe.directory "$PWD/shitty" && git -C shitty log --oneline -1

      # The release tree carries a pkg-config file whose Libs.private
      # records what this host's probes chose, so nothing here has to know
      # or guess which system libraries the archive needs.
      - name: Package libshitty_vt
        run: |
          (cd shitty && ./build tgz)
          mkdir -p release
          tar xzf shitty/.build/shitty_vt.tgz -C release --strip-components=1
          echo "PKG_CONFIG_PATH=$PWD/release/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/release/lib" >> "$GITHUB_ENV"
          pkg-config --static --libs shitty_vt || true
        env:
          PKG_CONFIG_PATH: ""

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test against the shared library
        run: cargo test --workspace

      - name: Test against the static archive
        run: cargo test --workspace
        env:
          SHITTY_VT_STATIC: "1"
