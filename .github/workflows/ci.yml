name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Upstream is the moving part. The facade's contract can change under
    # this crate between releases - it already has once - so check daily
    # rather than finding out when someone builds against a new shitty.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    name: build the facade, test both link modes
    runs-on: ubuntu-24.04
    # The core is C++26. Fedora's stock toolchain can build it, and keeping
    # the terminal and the tests on one libc matters: a nix-built library
    # against a system-built test binary fails to load.
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install the toolchain
        run: |
          for attempt in 1 2 3; do
            if dnf -y --setopt=install_weak_deps=False \
                --setopt=retries=10 --setopt=timeout=60 \
                --setopt=fastestmirror=True --setopt=zchunk=False \
                install \
                gcc-c++ make git python3 perl pkgconf-pkg-config diffutils \
                binutils ragel cargo rustfmt clippy \
                freetype-devel fontconfig-devel harfbuzz-devel \
                libxkbcommon-devel; then
              exit 0
            fi
            echo "dnf attempt $attempt failed, retrying"
          done
          exit 1

      - name: Check out the bindings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out shitty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/shitty
          ref: master
          path: shitty

      - name: Record which shitty this is
        run: git config --global --add safe.directory "$PWD/shitty" && git -C shitty log --oneline -1

      - name: Build libshitty_vt
        working-directory: shitty
        run: ./build a so

      # The static archive cannot carry the system libraries libstd probed
      # for, and which those are varies by host - this job and a Fedora
      # workstation already disagree - so read them back off the shared
      # object rather than guessing. See pg83/shitty#102.
      - name: Derive the static link libraries
        run: |
          libs=$(readelf -d shitty/.build/libshitty_vt.so \
            | sed -n 's/.*NEEDED.*\[lib\(.*\)\.so.*/\1/p' \
            | grep -vxE 'c|m|dl|rt|pthread|gcc_s|stdc\+\+' \
            | paste -sd,)
          echo "derived: ${libs:-none}"
          echo "SHITTY_VT_LINK_LIBS=$libs" >> "$GITHUB_ENV"
          echo "SHITTY_VT_LIB_DIR=$PWD/shitty/.build" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test against the shared library
        run: cargo test --workspace
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/shitty/.build

      - name: Test against the static archive
        run: cargo test --workspace
        env:
          SHITTY_VT_STATIC: "1"
